<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="popup.title">MyKeepに保存</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <header>
      <h1 data-i18n="popup.title">MyKeepに保存</h1>
      <div class="open-note-slot">
        <button id="openNote" type="button" class="secondary" data-i18n="popup.openMyKeep" hidden>MyKeepで表示</button>
      </div>
      <button id="save" type="submit" form="captureForm" class="primary" data-i18n="popup.save" disabled>保存</button>
    </header>
    <form id="captureForm">
      <label><span data-i18n="popup.field.title">タイトル</span><input id="title" type="text" maxlength="300" /></label>
      <label><span data-i18n="popup.field.url">URL</span><input id="url" type="url" maxlength="2000" readonly /></label>
      <label><span data-i18n="popup.field.note">メモ</span><textarea id="body" rows="1" maxlength="100000" data-i18n-placeholder="popup.notePlaceholder" placeholder="任意のメモ"></textarea></label>
      <section class="labels-field" aria-labelledby="labelsHeading">
        <span id="labelsHeading" class="field-label" data-i18n="popup.field.labels">ラベル</span>
        <div class="label-pin-row">
          <div class="label-picker">
            <button id="labelToggle" type="button" class="label-picker-toggle" data-i18n="popup.selectLabels" aria-expanded="false" aria-controls="labelOptions" disabled>ラベルを選択</button>
            <div id="labelOptions" class="label-picker-menu" hidden></div>
          </div>
          <label class="pin-option"><input id="pinned" type="checkbox" /><span data-i18n="popup.pinned">ピン留め</span></label>
        </div>
        <div id="selectedLabels" class="selected-labels" aria-live="polite"></div>
        <p id="labelStatus" class="label-status" role="status" aria-live="polite"></p>
      </section>
      <label><span data-i18n="popup.field.image">画像</span><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" /></label>
      <div id="pasteArea" data-i18n="popup.pasteImage" tabindex="0">画像はここで Ctrl+V でも貼り付けできます</div>
      <div id="imagePreview" hidden>
        <img id="previewImage" data-i18n-alt="popup.imagePreviewAlt" alt="添付画像のプレビュー" />
        <span id="imageName"></span>
        <button id="removeImage" type="button" class="text-button" data-i18n="popup.removeImage">画像を外す</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </body>
</html>
